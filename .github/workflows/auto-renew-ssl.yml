name: Auto Renew ZeroSSL and Update Cloudflare KV

on:
  schedule:
    - cron: '0 0 1 */2 *' # Chạy 2 tháng 1 lần (ZeroSSL có hạn 90 ngày)
  workflow_dispatch: # Cho phép chạy thủ công
  repository_dispatch:
    types: [renew-ssl] # Cho phép Cloudflare Pages gọi qua API
  push:
    branches:
      - main # TỰ ĐỘNG CHẠY NGAY LẬP TỨC KHI BẠN PUSH CODE

permissions:
  contents: write

jobs:
  renew-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Install acme.sh
        run: |
          curl https://get.acme.sh | sh -s email=admin@khoindvn.io.vn
          echo "$HOME/.acme.sh" >> $GITHUB_PATH

      - name: Set Default CA to ZeroSSL
        run: |
          ~/.acme.sh/acme.sh --set-default-ca --server zerossl

      - name: Register ZeroSSL Account
        env:
          ZEROSSL_EMAIL: ${{ secrets.ZEROSSL_EMAIL }}
        run: |
          ~/.acme.sh/acme.sh --register-account -m $ZEROSSL_EMAIL

      - name: Issue ZeroSSL Certificate for muacert.com
        env:
          CF_Token: ${{ secrets.CF_API_TOKEN }}
          CF_Account_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          ~/.acme.sh/acme.sh --issue --dns dns_cf -d muacert.com --keylength 2048

      - name: Issue ZeroSSL Certificate for khoindvn.io.vn
        env:
          CF_Token: ${{ secrets.CF_API_TOKEN }}
          CF_Account_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          ~/.acme.sh/acme.sh --issue --dns dns_cf -d khoindvn.io.vn --keylength 2048

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Upload Certificates to Cloudflare KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
        run: |
          CERT_PATH=~/.acme.sh/muacert.com/muacert.com.cer
          KEY_PATH=~/.acme.sh/muacert.com/muacert.com.key
          FULLCHAIN_PATH=~/.acme.sh/muacert.com/fullchain.cer
          
          # Upload lên Cloudflare KV
          wrangler kv key put --namespace-id=$KV_NAMESPACE_ID "cert.pem" --path="$CERT_PATH" --remote
          wrangler kv key put --namespace-id=$KV_NAMESPACE_ID "key.pem" --path="$KEY_PATH" --remote
          wrangler kv key put --namespace-id=$KV_NAMESPACE_ID "ca.pem" --path="$FULLCHAIN_PATH" --remote
          
          echo "Đã cập nhật chứng chỉ ZeroSSL muacert.com lên Cloudflare KV thành công!"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install node-forge
        run: npm install node-forge

      - name: Sign Mobileconfig Profiles
        run: |
          cat << 'EOF' > sign_profile.js
          const fs = require('fs');
          const forge = require('node-forge');

          function signMobileconfig(inputFile, outputFile, certPath, keyPath, caPath) {
            if (!fs.existsSync(inputFile)) {
              console.log(`Bỏ qua ${inputFile}: không tìm thấy file.`);
              return;
            }
            if (!fs.existsSync(certPath) || !fs.existsSync(keyPath)) {
              console.log(`Bỏ qua ${inputFile}: không tìm thấy chứng chỉ ${certPath}`);
              return;
            }

            const certPem = fs.readFileSync(certPath, 'utf8');
            const keyPem = fs.readFileSync(keyPath, 'utf8');
            const caPem = fs.existsSync(caPath) ? fs.readFileSync(caPath, 'utf8') : null;
            const unsignedProfile = fs.readFileSync(inputFile, 'utf8');

            const p7 = forge.pkcs7.createSignedData();
            p7.content = forge.util.createBuffer(unsignedProfile, 'utf8');
            
            const cert = forge.pki.certificateFromPem(certPem);
            const privateKey = forge.pki.privateKeyFromPem(keyPem);
            
            p7.addCertificate(cert);
            if (caPem) {
                const caCert = forge.pki.certificateFromPem(caPem);
                p7.addCertificate(caCert);
            }
            
            p7.addSigner({
              key: privateKey,
              certificate: cert,
              digestAlgorithm: forge.pki.oids.sha256,
              authenticatedAttributes: [
                { type: forge.pki.oids.contentType, value: forge.pki.oids.data },
                { type: forge.pki.oids.messageDigest },
                { type: forge.pki.oids.signingTime }
              ]
            });

            p7.sign();
            const signedDer = forge.asn1.toDer(p7.toAsn1()).getBytes();
            
            const buffer = Buffer.alloc(signedDer.length);
            for (let i = 0; i < signedDer.length; i++) {
                buffer[i] = signedDer.charCodeAt(i);
            }
            
            fs.writeFileSync(outputFile, buffer);
            console.log(`Đã ký thành công ${inputFile} (${certPath}) -> ${outputFile}`);
          }

          // Ký udid.mobileconfig bằng cert muacert.com
          signMobileconfig(
            'udid_unsigned.mobileconfig',
            'udid.mobileconfig',
            process.env.HOME + '/.acme.sh/muacert.com/muacert.com.cer',
            process.env.HOME + '/.acme.sh/muacert.com/muacert.com.key',
            process.env.HOME + '/.acme.sh/muacert.com/fullchain.cer'
          );

          // Ký khoindvn.mobileconfig bằng cert khoindvn.io.vn
          signMobileconfig(
            'khoindvn_unsigned.mobileconfig',
            'khoindvn.mobileconfig',
            process.env.HOME + '/.acme.sh/khoindvn.io.vn/khoindvn.io.vn.cer',
            process.env.HOME + '/.acme.sh/khoindvn.io.vn/khoindvn.io.vn.key',
            process.env.HOME + '/.acme.sh/khoindvn.io.vn/fullchain.cer'
          );
          EOF
          
          node sign_profile.js

      - name: Commit and Push Signed Mobileconfig Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add udid.mobileconfig khoindvn.mobileconfig
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update signed mobileconfig profiles [skip ci]" && git push)

      - name: Upload Signed Profile to GitHub Release 'DNS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload DNS khoindvn.mobileconfig udid.mobileconfig --clobber || gh release create DNS khoindvn.mobileconfig udid.mobileconfig --title "DNS" --notes "File profile khoindvn và udid đã ký tự động"

      - name: Upload Signed Profiles as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed_mobileconfig
          path: |
            udid.mobileconfig
            khoindvn.mobileconfig
          retention-days: 7
